<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Penguin Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one handheld-style column. Pixel-art hill scene on top, a strip of five gates, then one card that holds the intro, the current question or the result. */
:root {
  --bg: #121a38;
  --panel: #1c2750;
  --panel-2: #26346a;
  --edge: #0a1028;
  --ink: #eef7ff;
  --muted: #bfd2f0;
  --ice: #cfe9ff;
  --accent: #ff9d2e;
  --accent-edge: #b55f0a;
  --good: #3fd488;
  --good-edge: #1c8a56;
  --bad: #ff6b6b;
  --bad-edge: #a93434;
  --font-display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; image-rendering: pixelated; pointer-events: none; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 19px;
  line-height: 1.4;
  font-variant-numeric: lining-nums;
  padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; }
.brand { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.ttl { min-width: 0; padding-top: 2px; }
.menu-btn { flex: none; width: 46px; height: 46px; display: grid; place-content: center; gap: 5px; background: var(--panel); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.menu-btn i { display: block; width: 22px; height: 4px; background: var(--ink); }
.menu-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.menu-btn[aria-expanded="true"] { background: var(--panel-2); }
.menu-btn[aria-expanded="true"] i { background: var(--accent); }
.menu-panel { position: absolute; z-index: 30; top: 56px; left: 0; width: min(340px, 100%); display: grid; gap: 8px; padding: 12px; background: var(--panel); border: 4px solid var(--edge); box-shadow: 0 6px 0 var(--edge); }
.mi { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 12px; text-align: left; font: 700 19px/1.2 var(--font-body); color: var(--ink); background: var(--panel-2); border: 3px solid var(--edge); box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.mi:hover { background: #31428a; }
.mi:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.mi small { font: 700 12px/1.3 var(--font-body); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; text-align: right; }
.mi.cur { border-color: var(--accent); }
.mi.done small { color: var(--good); }
.mi.mid small { color: var(--accent); }
.msearch { width: 100%; padding: 11px 12px; font: 400 19px/1.2 var(--font-body); color: var(--ink); background: var(--edge); border: 3px solid var(--edge); border-radius: 0; outline: none; }
.msearch::placeholder { color: var(--muted); opacity: .85; }
.msearch:focus-visible { border-color: var(--ice); }
.mlist { display: grid; gap: 8px; max-height: min(46vh, 340px); overflow-y: auto; padding: 2px 4px 6px 2px; }
.mempty { margin: 6px 2px; color: var(--muted); }
.tm { display: flex; align-items: center; gap: 12px; }
.tbar { flex: 1; height: 16px; background: var(--edge); border: 3px solid var(--edge); }
.tfill { height: 100%; width: 100%; background: var(--good); }
.tm.low .tfill { background: var(--accent); }
.tm.crit .tfill { background: var(--bad); }
.tnum { min-width: 70px; text-align: right; font: 700 30px/1 var(--font-body); font-variant-numeric: tabular-nums; }
.tnum small { font-size: 15px; color: var(--muted); margin-left: 4px; }
.tm.crit .tnum { color: var(--bad); }
.mi.home { justify-content: center; background: transparent; box-shadow: none; color: var(--muted); font-size: 17px; }
h1 { margin: 0; font: 400 13px/1.3 var(--font-display); letter-spacing: .03em; text-shadow: 2px 2px 0 var(--edge); text-transform: uppercase; }
h1 span { color: var(--accent); }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.streak { border: 3px solid var(--edge); background: var(--panel); padding: 7px 10px 6px; text-align: center; box-shadow: 0 3px 0 var(--edge); min-width: 72px; }
.lbl { display: block; font: 700 12px/1 var(--font-body); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.num { display: block; margin-top: 6px; font: 700 28px/1 var(--font-body); color: var(--accent); }

.screen { border: 4px solid var(--edge); box-shadow: 0 6px 0 var(--edge); background: #9ad5f6; line-height: 0; }
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }

.gates { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.gates li { border: 3px solid var(--edge); background: var(--panel); color: var(--muted); text-align: center; padding: 8px 0 8px; font: 700 17px/1 var(--font-body); }
.gates li.cur { border-color: var(--accent); color: var(--ink); }
.gates li.ok { background: var(--good); color: #04230f; }
.gates li.bad { background: var(--bad); color: #2b0505; }

.card { background: var(--panel); border: 4px solid var(--edge); box-shadow: 0 6px 0 var(--edge); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card p { margin: 0; }
.kick { font: 700 13px/1.4 var(--font-body); color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.h { margin: 0; font-size: 26px; line-height: 1.1; font-weight: 700; text-wrap: balance; }
.muted { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.chips li { border: 3px solid var(--edge); background: var(--panel-2); padding: 3px 9px; font-size: 16px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: var(--muted); }
.chip { font: 700 14px/1 var(--font-body); background: var(--accent); color: #2a1500; padding: 7px 10px; border: 3px solid var(--edge); text-transform: uppercase; letter-spacing: .06em; }
.q { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 600; text-wrap: pretty; }

.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: center; text-align: left; width: 100%; min-height: 56px; padding: 10px 12px; font: 700 19px/1.3 var(--font-body); color: var(--ink); background: var(--panel-2); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.opt .l { font: 700 16px/1 var(--font-body); color: var(--muted); }
.opt:hover:not(:disabled) { background: #31428a; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.opt:disabled { cursor: default; }
.opt.good { background: var(--good); color: #04230f; box-shadow: 0 4px 0 var(--good-edge); }
.opt.good .l { color: #04230f; }
.opt.bad { background: var(--bad); color: #2b0505; box-shadow: 0 4px 0 var(--bad-edge); }
.opt.bad .l { color: #2b0505; }
.opt.dim { opacity: .5; }

.why { background: var(--edge); padding: 12px; display: grid; gap: 8px; font-size: 17px; }
.verdict { font: 700 14px/1.4 var(--font-body); letter-spacing: .1em; text-transform: uppercase; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

.btn { font: 700 17px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; padding: 14px 16px; width: 100%; color: #2a1500; background: var(--accent); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--accent-edge); cursor: pointer; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-edge); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 var(--edge); }
.btn.ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--edge); }
button:focus-visible, summary:focus-visible, textarea:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }

.subs { display: grid; gap: 10px; }
.sub-btn { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 58px; padding: 10px 14px; font: 600 21px/1.2 var(--font-body); color: var(--ink); background: var(--panel-2); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.sub-btn:hover { background: #31428a; }
.sub-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.sub-btn small { font: 400 9px/1.5 var(--font-display); color: var(--muted); text-transform: uppercase; text-align: right; }
.sub-btn.done small { color: var(--good); }
.sub-btn.mid small { color: var(--accent); }
.score { font: 700 46px/1 var(--font-body); color: var(--ice); }
.score small { font-size: 24px; color: var(--muted); }
.squares { display: flex; flex-wrap: wrap; gap: 6px; }
.sq { width: 36px; height: 36px; border: 3px solid var(--edge); display: grid; place-items: center; font: 700 20px/1 var(--font-body); }
.sq.ok { background: var(--good); color: #04230f; }
.sq.bad { background: var(--bad); color: #2b0505; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 3px solid var(--edge); background: var(--panel-2); padding: 10px; text-align: center; }
.stat b { display: block; font: 700 30px/1.1 var(--font-body); color: var(--accent); margin-bottom: 6px; }
.stat span { font-size: 15px; color: var(--muted); }
.msg { min-height: 1.4em; font-size: 16px; color: var(--muted); }
#shareBox { width: 100%; resize: none; background: var(--edge); color: var(--ink); border: 3px solid var(--edge); padding: 10px; font: 400 16px/1.4 var(--font-body); }
details.review { border: 3px solid var(--edge); background: var(--panel-2); }
detailsdetails.review summary { cursor: pointer; padding: 12px; font-weight: 700; font-size: 18px; }
.rv { padding: 0 12px 12px; display: grid; gap: 14px; }
.rv article { display: grid; gap: 4px; font-size: 16px; }
.rv .t { font: 700 13px/1.4 var(--font-body); letter-spacing: .08em; text-transform: uppercase; }
.rv .t.good { color: var(--good); }
.rv .t.bad { color: var(--bad); }
.next { text-align: center; color: var(--muted); font-size: 16px; }
.next b { color: var(--ink); font-variant-numeric: tabular-nums; }
.foot { margin: 0; padding: 9px 12px; background: var(--edge); color: var(--muted); font-size: 15px; text-align: center; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { .btn, .opt { transition: none; } }
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="top">
    <div class="brand">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Subjects menu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel"><i></i><i></i><i></i></button>
      <div class="ttl">
        <h1>Penguin <span>Pass</span></h1>
        <p class="sub" id="sub">Daily Leaving Cert runs</p>
      </div>
    </div>
    <div class="streak"><span class="lbl">Streak</span><span class="num" id="streakNum">0</span></div>
    <nav class="menu-panel" id="menuPanel" aria-label="Subjects" hidden>
      <label class="kick" for="menuSearch">Find a subject</label>
      <input class="msearch" id="menuSearch" type="search" placeholder="Search subjects" autocomplete="off" spellcheck="false">
      <div class="mlist" id="menuList"></div>
    </nav>
  </header>
  <div class="screen"><canvas id="scene" width="200" height="150" role="img" aria-label="Top-down pixel-art view of a penguin at the start of a snowy mountain course"></canvas></div>
  <ol class="gates" id="gates" aria-label="Run progress"></ol>
  <section class="card" id="card"></section>
  <p class="foot">Prototype with 12 sample questions per subject. Progress is saved in this browser only.</p>
  <p class="sr-only" id="sr" aria-live="polite"></p>
</main>

<script>
(function () {
'use strict';
var W = 200, H = 150;
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var RM = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------------- content ---------------- */
var SUBJECTS = [
  { id: 'bio', name: 'Biology' },
  { id: 'bus', name: 'Business' },
  { id: 'che', name: 'Chemistry' },
  { id: 'eco', name: 'Economics' },
  { id: 'eng', name: 'English' },
  { id: 'geo', name: 'Geography' },
  { id: 'his', name: 'History' },
  { id: 'phy', name: 'Physics' }
];
/* First answer in each list is the correct one. Options are shuffled when the run is built. */
var BANK = {
  geo: [
    { q: `The Mid-Atlantic Ridge is an example of which type of plate boundary?`, a: [`Constructive`, `Destructive`, `Conservative`, `Collision`], why: `Plates move apart here and new crust forms as magma rises, so it is a constructive boundary.` },
    { q: `Which river is the longest in Ireland?`, a: [`Shannon`, `Liffey`, `Lee`, `Boyne`], why: `The Shannon is about 360 km long and is the longest river in the British Isles.` },
    { q: `Stones in a river knock against each other and become smaller and rounder. What is this erosion process called?`, a: [`Attrition`, `Abrasion`, `Hydraulic action`, `Solution`], why: `Attrition is stones wearing each other down. Abrasion is stones scraping the bed and banks.` },
    { q: `Which rock type forms when magma cools and hardens?`, a: [`Igneous`, `Sedimentary`, `Metamorphic`, `Mineral`], why: `Igneous rocks such as granite and basalt form when molten rock cools and solidifies.` },
    { q: `Which region of County Clare is famous for its karst landscape?`, a: [`The Burren`, `The Cooley Peninsula`, `The Wicklow Mountains`, `The Slieve Bloom Mountains`], why: `The Burren has limestone pavement, caves and swallow holes, all typical karst features.` },
    { q: `What do we call a line on a map that joins places of equal height above sea level?`, a: [`Contour line`, `Grid line`, `Isobar`, `Meridian`], why: `Contour lines join points at the same altitude. Lines close together show a steep slope.` },
    { q: `Which type of volcano has steep sides built from alternating layers of ash and lava?`, a: [`Composite volcano`, `Shield volcano`, `Cinder cone`, `Fold mountain`], why: `Composite volcanoes have steep sides built from layers of ash and lava. Shield volcanoes are wide with gentle slopes.` },
    { q: `What is the name of the process in which water vapour cools and changes into liquid droplets?`, a: [`Condensation`, `Evaporation`, `Precipitation`, `Transpiration`], why: `Condensation happens when air cools and water vapour turns into tiny droplets, forming cloud.` },
    { q: `A U-shaped valley was most likely carved by which agent of erosion?`, a: [`A glacier`, `A river`, `Wind`, `The sea`], why: `Glaciers carve wide valleys with steep sides and a flat floor. Rivers cut V-shaped valleys.` },
    { q: `Which of these is a primary sector activity?`, a: [`Farming`, `Car assembly`, `Banking`, `Teaching`], why: `Primary activities take raw materials from the earth or sea, such as farming, fishing and mining.` },
    { q: `What type of boundary is the San Andreas Fault, where plates slide past each other?`, a: [`Conservative`, `Constructive`, `Destructive`, `Subduction zone`], why: `At a conservative boundary plates slide past each other and crust is neither created nor destroyed.` },
    { q: `Which instrument records the shaking caused by an earthquake?`, a: [`Seismograph`, `Barometer`, `Anemometer`, `Thermometer`], why: `A seismograph records ground vibrations. A barometer measures air pressure and an anemometer measures wind speed.` }
  ],
  bio: [
    { q: `Which organelle is the site of photosynthesis in a plant cell?`, a: [`Chloroplast`, `Mitochondrion`, `Ribosome`, `Vacuole`], why: `Chloroplasts contain chlorophyll, which absorbs the light energy used in photosynthesis.` },
    { q: `Which enzyme breaks down starch into maltose?`, a: [`Amylase`, `Protease`, `Lipase`, `Catalase`], why: `Amylase digests starch. Protease acts on protein and lipase acts on fats.` },
    { q: `Which substance in red blood cells carries oxygen around the body?`, a: [`Haemoglobin`, `Chlorophyll`, `Insulin`, `Keratin`], why: `Haemoglobin binds oxygen in the lungs and releases it in the tissues.` },
    { q: `In DNA, which base pairs with adenine?`, a: [`Thymine`, `Cytosine`, `Guanine`, `Uracil`], why: `A pairs with T and C pairs with G. Uracil replaces thymine in RNA.` },
    { q: `Water moves across a partially permeable membrane from a region of high water concentration to a region of low water concentration. What is this called?`, a: [`Osmosis`, `Diffusion`, `Active transport`, `Transpiration`], why: `That is the definition of osmosis. Diffusion covers the movement of other particles.` },
    { q: `How many daughter cells does one cell produce by meiosis?`, a: [`Four`, `Two`, `Eight`, `One`], why: `Meiosis makes four genetically different cells, each with half the chromosome number.` },
    { q: `What is the name of the process by which plants lose water vapour through their leaves?`, a: [`Transpiration`, `Respiration`, `Digestion`, `Germination`], why: `Transpiration is the loss of water vapour from the plant, mainly through the stomata.` },
    { q: `Which blood vessels carry blood away from the heart?`, a: [`Arteries`, `Veins`, `Capillaries`, `Lymph vessels`], why: `Arteries carry blood away from the heart under high pressure. Veins carry it back.` },
    { q: `Which part of the cell controls its activities and contains the DNA?`, a: [`Nucleus`, `Cell wall`, `Cytoplasm`, `Vacuole`], why: `The nucleus holds the chromosomes and controls the activities of the cell.` },
    { q: `Which gas is released as a by-product of photosynthesis?`, a: [`Oxygen`, `Carbon dioxide`, `Nitrogen`, `Hydrogen`], why: `Plants take in carbon dioxide and water and release oxygen.` },
    { q: `What is an organism that makes its own food from simple inorganic substances called?`, a: [`Producer`, `Consumer`, `Decomposer`, `Parasite`], why: `Producers, such as green plants, make their own food. Consumers feed on other organisms.` },
    { q: `Two heterozygous parents (Tt × Tt) have offspring. What fraction are expected to show the recessive trait?`, a: [`One quarter`, `One half`, `Three quarters`, `All of them`], why: `Tt × Tt gives TT, Tt, Tt and tt, so one in four offspring show the recessive trait.` }
  ],
  eng: [
    { q: `Who wrote the poem "Digging"?`, a: [`Seamus Heaney`, `W.B. Yeats`, `Patrick Kavanagh`, `Eavan Boland`], why: `Heaney compares his pen to his father's spade in "Digging", from Death of a Naturalist.` },
    { q: `A word that sounds like the noise it describes, such as "buzz" or "crash", is an example of what?`, a: [`Onomatopoeia`, `Alliteration`, `Assonance`, `Personification`], why: `In onomatopoeia the sound of the word imitates the sound it names.` },
    { q: `In Macbeth, who says "Out, damned spot!"?`, a: [`Lady Macbeth`, `Macbeth`, `Banquo`, `Lady Macduff`], why: `Lady Macbeth says it while sleepwalking, troubled by guilt over Duncan's murder.` },
    { q: `Which term describes saying that one thing is another, with no "like" or "as"?`, a: [`Metaphor`, `Simile`, `Hyperbole`, `Irony`], why: `A metaphor states that one thing is another. A simile uses "like" or "as".` },
    { q: `Who wrote the novel Pride and Prejudice?`, a: [`Jane Austen`, `Charlotte Brontë`, `Mary Shelley`, `George Eliot`], why: `Jane Austen published Pride and Prejudice in 1813.` },
    { q: `A poem with fourteen lines is called a what?`, a: [`Sonnet`, `Ballad`, `Haiku`, `Elegy`], why: `A sonnet has fourteen lines. Shakespearean and Petrarchan sonnets are two common forms.` },
    { q: `Who wrote the novel The Great Gatsby?`, a: [`F. Scott Fitzgerald`, `Ernest Hemingway`, `John Steinbeck`, `Mark Twain`], why: `F. Scott Fitzgerald published The Great Gatsby in 1925.` },
    { q: `What is it called when nearby words begin with the same consonant sound, as in "wild and windy weather"?`, a: [`Alliteration`, `Assonance`, `Rhyme`, `Simile`], why: `Alliteration repeats initial consonant sounds. Assonance repeats vowel sounds.` },
    { q: `What is the term for the central character the audience follows in a story?`, a: [`Protagonist`, `Antagonist`, `Narrator`, `Foil`], why: `The protagonist is the main character. The antagonist is the character who opposes them.` },
    { q: `Who wrote the play Translations?`, a: [`Brian Friel`, `Samuel Beckett`, `J.M. Synge`, `Seán O'Casey`], why: `Brian Friel wrote Translations, first staged in 1980 and set in a hedge school in County Donegal.` },
    { q: `What is it called when a character speaks their thoughts aloud, usually alone on stage?`, a: [`Soliloquy`, `Aside`, `Prologue`, `Epilogue`], why: `In a soliloquy a character speaks their thoughts aloud so the audience hears them.` },
    { q: `Which of these Shakespeare plays is a tragedy?`, a: [`Hamlet`, `A Midsummer Night's Dream`, `Twelfth Night`, `The Tempest`], why: `Hamlet is a tragedy. The other three are comedies or romances.` }
  ],
  his: [
    { q: `In which year did the Easter Rising take place?`, a: [`1916`, `1913`, `1919`, `1921`], why: `The Rising began on Easter Monday, 24 April 1916.` },
    { q: `Who founded the Land League in 1879?`, a: [`Michael Davitt`, `Charles Stewart Parnell`, `Daniel O'Connell`, `John Redmond`], why: `Davitt founded it in Mayo in 1879. Parnell became its president.` },
    { q: `In which year did the potato blight first strike Ireland, starting the Great Famine?`, a: [`1845`, `1798`, `1801`, `1852`], why: `Blight first appeared in 1845 and the crop failed again in the years after.` },
    { q: `Who became the first President of Ireland in 1938?`, a: [`Douglas Hyde`, `Seán T. O'Kelly`, `Éamon de Valera`, `Erskine Childers`], why: `Douglas Hyde, a founder of the Gaelic League, took office in June 1938.` },

  if (now < P.dizzyUntil) drawStars(c, x, y, now);
}
function drawBanner(c, now) {
  var y = FIN - 7, x0 = 60, x1 = 140;
  c.fillStyle = '#a9c5ec'; c.fillRect(x0 + 3, y + 6, x1 - x0, 6);
  for (var s = 0; s < 2; s++) {
    var px = s ? x1 + 2 : x0 - 2;
    dot(c, px + 1, y + 4, '#a9c5ec', 4, 4);
    c.fillStyle = '#5b4630'; fillEllipse(c, px, y + 2, 3, 3); dot(c, px - 1, y + 1, '#c9a074');
  }
  for (var yy = 0; yy < 6; yy++) for (var xx = x0; xx < x1; xx++) dot(c, xx, y + yy, (((xx - x0) >> 2) + (yy >> 1)) & 1 ? '#1d2b5c' : '#ffffff');
  c.fillStyle = '#0b1230'; c.fillRect(x0, y - 1, x1 - x0, 1); c.fillRect(x0, y + 6, x1 - x0, 1);
}
function render(now, dt) {
  camY += (camTarget() - camY) * Math.min(1, dt / 140);
  var cy = Math.round(camY);
  ctx.drawImage(worldC, 0, cy, W, H, 0, 0, W, H);
  ctx.drawImage(trackC, 0, cy, W, H, 0, 0, W, H);
  ctx.save(); ctx.translate(0, -cy);
  if (!RM) SPARK.forEach(function (s) {
    if (s.y < cy - 3 || s.y > cy + H + 3) return;
    if (((now + s.p) % 2600) < 200) { ctx.fillStyle = '#ffffff'; ctx.fillRect(s.x, s.y, 1, 1); ctx.fillRect(s.x - 1, s.y, 1, 1); ctx.fillRect(s.x + 1, s.y, 1, 1); ctx.fillRect(s.x, s.y - 1, 1, 1); ctx.fillRect(s.x, s.y + 1, 1, 1); }
  });
  for (var i = 0; i < 7; i++) { drawRock(ctx, i, now); drawGate(ctx, i, now); }
  if (P.mode === 'slide' && !RM && Math.random() < 0.9) {
    var h = heading(P.y), hx = xc(P.y) + P.dx, rv = Math.random();
    parts.push({ x: hx - Math.cos(h) * 9 + (Math.random() - .5) * 6, y: P.y - Math.sin(h) * 9 + (Math.random() - .5) * 4, vx: -Math.cos(h) * (0.3 + rv * 0.8) + (Math.random() - .5) * 0.8, vy: -Math.sin(h) * (0.3 + rv * 0.8), l: 350 + Math.random() * 250, c: ['#ffffff', '#d9ebfb', '#9fc2ea'][Math.floor(Math.random() * 3)], d: 0.94, s: 2 });
  }
  stepParts(dt);
  var heroLow = P.mode === 'stand', k;
  for (k = 0; k < GREET.length; k++) if (GREET[k].y + 40 > cy && GREET[k].y - 40 < cy + H && !(heroLow && GREET[k].y > P.y)) drawGreeter(ctx, GREET[k], now);
  parts.forEach(function (p) { ctx.fillStyle = p.c; var z = p.l > 220 ? p.s : 1; ctx.fillRect(Math.round(p.x), Math.round(p.y), z, z); });
  drawHero(ctx, now);
  if (heroLow) for (k = 0; k < GREET.length; k++) if (GREET[k].y > P.y) drawGreeter(ctx, GREET[k], now);
  drawBanner(ctx, now);
  ctx.restore();
}
var lastT = performance.now();
function frame(now) { var dt = Math.min(now - lastT, 50); lastT = now; render(now, dt); requestAnimationFrame(frame); }

/* ---------------- game state ---------------- */
var TODAY = todayKey(), run = null, qi = 0, view = 'menu', locked = false, cdTimer = null, qTimer = null;
var QTIME = 30;
function score() { return run.answers.filter(function (a, i) { return a === run.qs[i].correct; }).length; }
function perfect() { return run.answers.length === N && score() === N; }
function currentStreak() { return (store.last === TODAY || store.last === prevKey(TODAY)) ? store.streak : 0; }
function updateStreak() { $('streakNum').textContent = String(currentStreak()); }
function sr(t) { $('sr').textContent = t; }
function dayRec(id) {
  var d = store.days[TODAY], r = d && d[id];
  if (r && Array.isArray(r.answers) && r.answers.length <= N && r.answers.every(function (a) { return Number.isInteger(a) && a >= -1 && a < 4; })) return r;
  return null;
}
function updateAria() {
  var n = run ? run.answers.length : 0;
  cv.setAttribute('aria-label', 'Top-down pixel-art view of a penguin sliding on its stomach down a snowy mountain past ' + N + ' flags to a finish line. ' + (n === 0 ? 'The penguin is at the top.' : 'It has passed ' + n + ' of ' + N + ' gates.'));
}
function persist() {
  var done = run.answers.length >= N;
  var day = store.days[run.key] || (store.days[run.key] = {});
  day[run.subject.id] = { answers: run.answers.slice(), done: done };
  if (done && store.last !== run.key) {
    store.streak = (store.last === prevKey(run.key)) ? store.streak + 1 : 1;
    store.best = Math.max(store.best || 0, store.streak);
    store.last = run.key;
  }
  var keys = Object.keys(store.days).sort();
  while (keys.length > 40) delete store.days[keys.shift()];
  save(); updateStreak();
}

/* ----- question timer ----- */
function stopTimer() { if (qTimer) { clearInterval(qTimer); qTimer = null; } }
function paintTimer(left) {
  var f = $('tFill'), n = $('tNum'), tm = $('tm');
  if (!f || !n || !tm) return;
  left = Math.max(0, left);
  var secs = Math.ceil(left / 1000);
  f.style.width = (left / (QTIME * 1000) * 100) + '%';
  n.textContent = String(secs);
  tm.classList.toggle('low', secs <= 10);
  tm.classList.toggle('crit', secs <= 5);
  if (secs === 10 && !run.warn10) { run.warn10 = true; sr('10 seconds left'); }
}
function tickTimer() {
  if (view !== 'quiz' || locked || !run) { stopTimer(); return; }
  var left = run.deadline - Date.now();
  paintTimer(left);
  if (left <= 0) { stopTimer(); choose(-1); }
}
function startTimer() {
  stopTimer();
  run.deadline = Date.now() + QTIME * 1000; run.warn10 = false;
  paintTimer(QTIME * 1000);
  qTimer = setInterval(tickTimer, 100);
}
document.addEventListener('visibilitychange', tickTimer);

function renderGates() {
  var n = run ? run.answers.length : 0, html = '';
  for (var i = 0; i < N; i++) {
    var cls = '', st = 'not answered yet';
    if (run && i < n) { var ok = run.answers[i] === run.qs[i].correct; cls = ok ? 'ok' : 'bad'; st = ok ? 'correct' : 'missed'; }
    else if (view === 'quiz' && i === qi) { cls = 'cur'; st = 'current gate'; }
    html += '<li class="' + cls + '" aria-label="Gate ' + (i + 1) + ': ' + st + '">' + (i + 1) + '</li>';
  }
  $('gates').innerHTML = html;
}
function showWelcome() {
  stopCountdown(); stopTimer(); view = 'menu'; run = null; qi = 0; resetScene(); renderGates(); updateAria();
  $('card').innerHTML =
    '<p class="kick">Today\'s runs</p>' +
    '<h2 class="h">Choose a subject</h2>' +
    '<p>Open the menu in the top left and pick a subject. Each run is seven questions with 30 seconds each. You get one attempt per subject every day.</p>' +
    '<button class="btn" data-act="openmenu">Open subject menu</button>';
}
function renderQuestion(i, chosen) {
  var q = run.qs[i], answered = chosen !== null, ok = answered && chosen === q.correct, timedOut = answered && chosen < 0;
  var opts = q.opts.map(function (t, k) {
    var cls = 'opt';
    if (answered) { if (k === q.correct) cls += ' good'; else if (k === chosen) cls += ' bad'; else cls += ' dim'; }
    return '<button class="' + cls + '" data-k="' + k + '"' + (answered ? ' disabled' : '') + '><span class="l">' + 'ABCD'[k] + '</span><span>' + esc(t) + '</span></button>';
  }).join('');
  var why = '';
  if (answered) {
    why = '<div class="why"><p class="verdict ' + (ok ? 'good' : 'bad') + '">' + (ok ? 'Correct' : (timedOut ? 'Time\'s up' : 'Not quite')) + '</p>' +
      (ok ? '' : '<p>The answer is <b>' + esc(q.opts[q.correct]) + '</b>.</p>') + '<p>' + esc(q.why) + '</p></div>';
  }
  var timer = answered ? '' : '<div class="tm" id="tm" role="timer" aria-label="Time left"><div class="tbar"><div class="tfill" id="tFill"></div></div><div class="tnum"><span id="tNum">' + QTIME + '</span><small>sec</small></div></div>';
  $('card').innerHTML =
    '<div class="meta"><span class="chip">' + q.subject.name + '</span><span>Gate ' + (i + 1) + ' of ' + N + '</span></div>' + timer +
    '<h2 class="q">' + esc(q.q) + '</h2>' +
    '<div class="opts" role="group" aria-label="Answers">' + opts + '</div>' + why +
    (answered ? '<button class="btn" id="nextBtn" data-act="' + (i < N - 1 ? 'next' : 'finish') + '" hidden>' + (i < N - 1 ? 'Next gate' : 'Slide to base camp') + '</button>' : '');
}
function showQuestion() { view = 'quiz'; locked = false; renderGates(); renderQuestion(qi, null); updateAria(); startTimer(); }

async function choose(k) {
  if (locked || view !== 'quiz') return;
  locked = true; stopTimer();
  var myRun = run, q = run.qs[qi], ok = k === q.correct;
  run.answers.push(k); persist();
  renderQuestion(qi, k); renderGates(); sr(k < 0 ? 'Time is up' : (ok ? 'Correct' : 'Not quite'));
  var fin = await slideTo(qi, ok);
  if (!fin || run !== myRun) return;
  var nb = $('nextBtn'); if (nb) { nb.hidden = false; nb.focus({ preventScroll: true }); }
  updateAria();
}
async function finishRun() {
  var myRun = run, b = $('nextBtn'); if (b) b.disabled = true;
  var fin = await slideFinish(perfect());
  if (!fin || run !== myRun) return;
  showResult();
}

var TITLES = ['Snowdrift landing', 'Face-first finish', 'Wobbly start', 'Bumpy ride', 'Steady slide', 'Smooth run', 'Nearly flawless', 'Perfect slide'];
function shareText() {
  var sq = run.answers.map(function (a, i) { return a === run.qs[i].correct ? '🟩' : '🟥'; }).join('');
  return 'Penguin Pass · ' + run.subject.name + ' · Day ' + run.dayNo + '\n🐧 ' + score() + '/' + N + '\n' + sq;
}
function showResult() {
  view = 'result'; stopTimer(); renderGates(); updateAria();
  var sc = score();
  var sq = run.answers.map(function (a, i) { var ok = a === run.qs[i].correct; return '<span class="sq ' + (ok ? 'ok' : 'bad') + '" aria-label="Gate ' + (i + 1) + ': ' + (ok ? 'correct' : (a < 0 ? 'time ran out' : 'missed')) + '">' + (ok ? '✓' : '✗') + '</span>'; }).join('');
  var review = run.qs.map(function (q, i) {
    var a = run.answers[i], ok = a === q.correct;
    return '<article><span class="t ' + (ok ? 'good' : 'bad') + '">Gate ' + (i + 1) + ' · ' + (ok ? 'Correct' : (a < 0 ? 'Time\'s up' : 'Missed')) + '</span><span>' + esc(q.q) + '</span><span class="muted">Answer: ' + esc(q.opts[q.correct]) + '. ' + esc(q.why) + '</span></article>';
  }).join('');
  var doneN = SUBJECTS.filter(function (s) { var r = dayRec(s.id); return r && r.done; }).length;
  $('card').innerHTML =
    '<p class="kick">' + run.subject.name + ' run complete</p>' +
    '<h2 class="h">' + TITLES[sc] + '</h2>' +
    '<div class="score">' + sc + '<small>/' + N + '</small></div>' +
    '<div class="squares">' + sq + '</div>' +
    '<div class="stats"><div class="stat"><b>' + currentStreak() + '</b><span>Day streak</span></div><div class="stat"><b>' + (store.best || 0) + '</b><span>Best streak</span></div><div class="stat"><b>' + doneN + '/' + SUBJECTS.length + '</b><span>Subjects today</span></div></div>' +
    '<button class="btn" data-act="share">Share result</button><p class="msg" id="shareMsg"></p><textarea id="shareBox" rows="4" readonly hidden aria-label="Result text to copy"></textarea>' +
    '<details class="review"><summary>Review answers</summary><div class="rv">' + review + '</div></details>' +
    '<p class="next" id="nextRun">New questions in <b id="cd">--:--:--</b></p>' +
    '<button class="btn ghost" data-act="openmenu">Try another subject</button>';
  startCountdown();
}
function stopCountdown() { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } }
function startCountdown() {
  stopCountdown();
  function tick() {
    var el = $('cd'); if (!el) { stopCountdown(); return; }
    if (todayKey() !== TODAY) { $('nextRun').innerHTML = '<button class="btn" data-act="newday">Start today\'s runs</button>'; stopCountdown(); return; }
    var n = new Date(), m = new Date(n.getFullYear(), n.getMonth(), n.getDate() + 1), s = Math.max(0, Math.floor((m - n) / 1000));
    el.textContent = [Math.floor(s / 3600), Math.floor(s % 3600 / 60), s % 60].map(function (v) { return String(v).padStart(2, '0'); }).join(':');
  }
  tick(); cdTimer = setInterval(tick, 1000);
}
async function share() {
  var text = shareText(), msg = $('shareMsg'), box = $('shareBox');
  try { await navigator.clipboard.writeText(text); msg.textContent = 'Copied. Paste it into your class chat.'; }
  catch (e) { box.hidden = false; box.value = text; box.focus(); box.select(); msg.textContent = 'Copy the text below.'; }
}
function startSubject(si) {
  stopCountdown(); stopTimer();
  var dayNo = dayNumber(TODAY), s = SUBJECTS[si];
  run = { mode: 'daily', key: TODAY, dayNo: dayNo, subject: s, si: si, qs: buildQs('daily', dayNo, si), answers: [] };
  var rec = dayRec(s.id);
  if (rec) run.answers = rec.answers.slice();
  var n = run.answers.length;
  if (n >= N) { setProgress(true); showResult(); }
  else { setProgress(false); qi = n; showQuestion(); }
}
function init() {
  stopCountdown(); stopTimer();
  closeMenu(false);
  TODAY = todayKey();
  $('sub').textContent = 'Daily Leaving Cert runs · Day ' + dayNumber(TODAY);
  updateStreak();
  showWelcome();
}

/* ----- subject menu with search ----- */
function menuStatus(i) {
  var r = dayRec(SUBJECTS[i].id);
  if (r && r.done) {
    var qs = buildQs('daily', dayNumber(TODAY), i);
    return ['done', 'Done ' + r.answers.filter(function (a, k) { return a === qs[k].correct; }).length + '/' + N];
  }
  if (r && r.answers.length) return ['mid', r.answers.length + '/' + N + ' answered'];
  return ['', 'New'];
}
function renderMenuList() {
  var raw = $('menuSearch').value.trim(), q = raw.toLowerCase(), cur = run ? run.si : -1, html = '', shown = 0;
  SUBJECTS.forEach(function (s, i) {
    if (q && s.name.toLowerCase().indexOf(q) === -1) return;
    shown++;
    var st = menuStatus(i);
    html += '<button class="mi ' + st[0] + (i === cur ? ' cur' : '') + '" type="button" data-msub="' + i + '"><span>' + s.name + '</span><small>' + st[1] + '</small></button>';
  });
  $('menuList').innerHTML = shown ? html : '<p class="mempty">No subject matches "' + esc(raw) + '".</p>';
}
function openMenu() { $('menuSearch').value = ''; renderMenuList(); $('menuPanel').hidden = false; $('menuBtn').setAttribute('aria-expanded', 'true'); }
function closeMenu(refocus) { $('menuPanel').hidden = true; $('menuBtn').setAttribute('aria-expanded', 'false'); if (refocus) $('menuBtn').focus(); }
$('menuBtn').addEventListener('click', function (e) { e.stopPropagation(); if ($('menuPanel').hidden) openMenu(); else closeMenu(false); });
$('menuSearch').addEventListener('input', renderMenuList);
$('menuSearch').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); var b = $('menuList').querySelector('button'); if (b) b.click(); }
});
$('menuPanel').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b || b.dataset.msub === undefined) return;
  closeMenu(false);
  var i = +b.dataset.msub;
  if (!(run && run.si === i && view !== 'menu')) startSubject(i);
});
document.addEventListener('click', function (e) {
  if (!$('menuPanel').hidden && !e.target.closest('#menuPanel') && !e.target.closest('#menuBtn')) closeMenu(false);
});
$('card').addEventListener('click', function (e) {
  var b = e.target.closest('[data-act],[data-k]');
  if (!b || b.disabled) return;
  if (b.dataset.k !== undefined) { choose(+b.dataset.k); return; }
  var a = b.dataset.act;
  if (a === 'next') { qi++; showQuestion(); }
  else if (a === 'finish') finishRun();
  else if (a === 'share') share();
  else if (a === 'openmenu') { e.stopPropagation(); openMenu(); }
  else if (a === 'newday') init();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !$('menuPanel').hidden) { closeMenu(true); return; }
  if (view === 'quiz' && !locked && $('menuPanel').hidden && /^[1-4]$/.test(e.key) && !(e.target.closest && e.target.closest('textarea,input'))) choose(+e.key - 1);
});

init();
render(performance.now(), 0);
requestAnimationFrame(frame);
})();
</script>

</body></html>
