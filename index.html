/* Layout: one handheld-style column. Pixel-art hill scene on top, a strip of five gates, then one card that holds the intro, the current question or the result. */
:root {
  --bg: #121a38;
  --panel: #1c2750;
  --panel-2: #26346a;
  --edge: #0a1028;
  --ink: #eef7ff;
  --muted: #bfd2f0;
  --ice: #cfe9ff;
  --accent: #ff9d2e;
  --accent-edge: #b55f0a;
  --good: #3fd488;
  --good-edge: #1c8a56;
  --bad: #ff6b6b;
  --bad-edge: #a93434;
  --font-display: 'Gurt Pixel', 'Courier New', ui-monospace, monospace;
  --font-body: 'Gurt Pixel', 'Courier New', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; image-rendering: pixelated; pointer-events: none; }
html { background: var(--bg); height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 20px;
  line-height: 1.35;
  -webkit-font-smoothing: none;
  font-synthesis: none;
  text-rendering: optimizeSpeed;
  padding-block: 10px 12px;
  height: 100vh; height: 100dvh; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { position: relative; z-index: 1; max-width: 560px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.top { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; }
.right { display: flex; align-items: center; gap: 8px; flex: none; }
.snd { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); background: var(--panel); border: 3px solid var(--edge); box-shadow: 0 3px 0 var(--edge); cursor: pointer; padding: 0; }
.snd:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.snd.off { color: var(--muted); }
.snd.off .waves, .snd:not(.off) .xmark { display: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ttl { min-width: 0; }
.menu-btn { flex: none; width: 40px; height: 40px; display: grid; place-content: center; gap: 4px; background: var(--panel); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--edge); cursor: pointer; }
.menu-btn i { display: block; width: 18px; height: 4px; background: var(--ink); }
.menu-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.menu-btn[aria-expanded="true"] { background: var(--panel-2); }
.menu-btn[aria-expanded="true"] i { background: var(--accent); }
.menu-panel { position: absolute; z-index: 30; top: 48px; left: 0; width: min(340px, 100%); display: grid; gap: 8px; padding: 12px; background: var(--panel); border: 4px solid var(--edge); box-shadow: 0 6px 0 var(--edge); }
.mi { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 8px 12px; text-align: left; font: 700 21px/1.2 var(--font-body); color: var(--ink); background: var(--panel-2); border: 3px solid var(--edge); box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.mi:hover { background: #31428a; }
.mi:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
.mi small { font: 700 14px/1.3 var(--font-body); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; text-align: right; }
.mi.cur { border-color: var(--accent); }
.mi.done small { color: var(--good); }
.mi.mid small { color: var(--accent); }
.msearch { width: 100%; padding: 11px 12px; font: 400 19px/1.2 var(--font-body); color: var(--ink); background: var(--edge); border: 3px solid var(--edge); border-radius: 0; outline: none; }
.msearch::placeholder { color: var(--muted); opacity: .85; }
.msearch:focus-visible { border-color: var(--ice); }
.mlist { display: grid; gap: 8px; max-height: min(46vh, 340px); overflow-y: auto; padding: 2px 4px 6px 2px; }
.mempty { margin: 6px 2px; color: var(--muted); }
.tm { display: flex; align-items: center; gap: 10px; }
.tbar { flex: 1; height: 14px; background: var(--edge); border: 3px solid var(--edge); }
.tfill { height: 100%; width: 100%; background: var(--good); }
.tm canvas { flex: none; width: 32px; height: 32px; image-rendering: pixelated; }
.tm.low .tfill { background: var(--bad); }
.tnum { min-width: 64px; text-align: right; font: 700 28px/1 var(--font-body); font-variant-numeric: tabular-nums; }
.tnum small { font-size: 15px; color: var(--muted); margin-left: 4px; }
.tm.low .tnum { color: var(--bad); }
.tm.crit .tnum { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.mi.home { justify-content: center; background: var(--accent); color: #2a1500; box-shadow: 0 3px 0 var(--accent-edge); text-transform: uppercase; letter-spacing: .06em; }
.mi.home:hover { background: #ffae4d; }
h1 { margin: 0; font: 700 21px/1.05 var(--font-body); letter-spacing: .04em; text-shadow: 3px 3px 0 var(--edge); text-transform: uppercase; }
h1 span { color: var(--accent); }
.sub { margin: 4px 0 0; color: var(--ice); font-size: 15px; letter-spacing: .04em; text-transform: uppercase; text-shadow: 1px 0 currentColor, 0 1px 0 var(--edge); }
.streak { border: 3px solid var(--edge); background: var(--panel); padding: 4px 8px 3px; text-align: center; box-shadow: 0 3px 0 var(--edge); min-width: 64px; }
.lbl { display: block; font: 700 13px/1 var(--font-body); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.num { display: block; margin-top: 4px; font: 700 24px/1 var(--font-body); color: var(--accent); }

.screen { position: relative; flex: 1 1 0; min-height: 72px; max-height: 460px; overflow: hidden; border: 4px solid var(--edge); box-shadow: 0 4px 0 var(--edge); background: #9ad5f6; line-height: 0; }
canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }

.gates { flex: none; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.gates li { border: 3px solid var(--edge); background: var(--panel); color: var(--muted); height: 14px; padding: 0; font-size: 0; }
.gates li.cur { border-color: var(--accent); color: var(--ink); }
.gates li.ok { background: var(--good); color: #04230f; }
.gates li.bad { background: var(--bad); color: #2b0505; }

.card { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; align-content: start; background: var(--panel); border: 4px solid var(--edge); box-shadow: 0 4px 0 var(--edge); padding: 10px 12px; display: grid; gap: 8px; min-width: 0; }
.card p { margin: 0; }
.kick { font: 700 15px/1.3 var(--font-body); color: var(--accent); letter-spacing: .12em; text-transform: uppercase; }
.h { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; text-wrap: balance; text-shadow: 3px 3px 0 var(--edge); }
.muted { color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; }
.chips li { border: 3px solid var(--edge); background: var(--panel-2); padding: 3px 9px; font-size: 16px; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; color: var(--muted); }
.chip { font: 700 14px/1 var(--font-body); background: var(--accent); color: #2a1500; padding: 5px 8px; border: 3px solid var(--edge); text-transform: uppercase; letter-spacing: .06em; }
.q { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 700; text-wrap: pretty; }

.opts { display: grid; gap: 7px; }
.opt { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; text-align: left; width: 100%; min-height: 44px; padding: 6px 10px; font: 700 18px/1.2 var(--font-body); color: var(--ink); background: var(--panel-2); border: 3px solid var(--edge); box-shadow: 0 3px 0 var(--edge); cursor: pointer; }
.opt .l { font: 700 17px/1 var(--font-body); color: var(--muted); }
.opt:hover:not(:disabled) { background: #31428a; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
.opt:disabled { cursor: default; }
.opt.good { background: var(--good); color: #04230f; box-shadow: 0 4px 0 var(--good-edge); }
.opt.good .l { color: #04230f; }
.opt.bad { background: var(--bad); color: #2b0505; box-shadow: 0 4px 0 var(--bad-edge); }
.opt.bad .l { color: #2b0505; }
.opt.dim { opacity: .5; }

.why { background: var(--edge); padding: 8px 10px; display: grid; gap: 4px; font-size: 16px; line-height: 1.25; }
.verdict { font: 700 16px/1.3 var(--font-body); letter-spacing: .1em; text-transform: uppercase; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }

.btn { font: 700 19px/1.2 var(--font-body); letter-spacing: .06em; text-transform: uppercase; padding: 10px 14px; width: 100%; color: #2a1500; background: var(--accent); border: 3px solid var(--edge); box-shadow: 0 4px 0 var(--accent-edge); cursor: pointer; }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-edge); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.ghost { background: var(--panel-2); color: var(--ink); box-shadow: 0 4px 0 var(--edge); }
